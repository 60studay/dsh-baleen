<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Serial bridge">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fdc"/>
      <stop offset="1" stop-color="#1d5fa6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)"/>
  <!-- DB9 shell -->
  <path d="M14 24 L20 18 H44 L50 24 V32 L44 38 H20 L14 32 Z" fill="#e9f4ff" opacity="0.95"/>
  <!-- pins -->
  <g fill="#1d5fa6">
