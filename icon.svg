    <circle cx="32" cy="26" r="2.4"/>
    <circle cx="42" cy="26" r="2.4"/>
    <circle cx="27" cy="32.5" r="2.4"/>
    <circle cx="37" cy="32.5" r="2.4"/>
  </g>
  <!-- cable leaving the shell -->
  <path d="M32 38 V46" stroke="#e9f4ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="50" r="3.2" fill="#7fe3a4"/>
</svg>
